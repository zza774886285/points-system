<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>积分系统 - 登录</title>
<style>
:root{
--bg:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
--card:rgba(255,255,255,0.95);
--text:#1d1d1f;
--text2:#86868b;
--accent:#6366f1;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
min-height:100vh;
background:var(--bg);
display:flex;align-items:center;justify-content:center;
padding:20px;
}
.login-card{
background:var(--card);
border-radius:20px;
padding:40px;
width:100%;max-width:360px;
box-shadow:0 20px 60px rgba(0,0,0,0.2);
}
.login-icon{
font-size:60px;text-align:center;
margin-bottom:20px;
}
h1{
font-size:24px;font-weight:700;
text-align:center;
margin-bottom:8px;
}
.subtitle{
font-size:14px;color:var(--text2);
text-align:center;
margin-bottom:30px;
}
.form-group{
margin-bottom:20px;
}
label{
display:block;
font-size:14px;font-weight:600;
margin-bottom:8px;
}
input[type="text"],
input[type="password"]{
width:100%;padding:14px 16px;
font-size:16px;
border:2px solid #e5e5e5;
border-radius:12px;
outline:none;
transition:border-color 0.2s;
}
input:focus{
border-color:var(--accent);
}
.btn{
width:100%;padding:14px;
font-size:16px;font-weight:600;
border:none;border-radius:12px;
cursor:pointer;
transition:all 0.2s;
}
.btn-primary{
background:var(--accent);
color:#fff;
}
.btn-primary:hover{
background:#5558e6;
transform:translateY(-1px);
}
.btn-child{
background:#f5f5f7;
color:var(--text);
margin-bottom:10px;
display:flex;align-items:center;justify-content:space-between;
}
.btn-child:hover{
background:#e8e8ed;
}
.child-icon{
font-size:24px;
}
.child-arrow{
color:var(--text2);
}
.error{
background:#fef2f2;
color:#dc2626;
padding:12px 16px;
border-radius:10px;
font-size:14px;
margin-bottom:20px;
}
.divider{
text-align:center;
margin:20px 0;
position:relative;
}
.divider::before,
.divider::after{
content:"";
position:absolute;top:50%;
width:calc(50% - 30px);
height:1px;background:#e5e5e5;
}
.divider::before{left:0}
.divider::after{right:0}
.divider span{
background:var(--card);
padding:0 10px;
font-size:13px;color:var(--text2);
position:relative;
}
</style>
</head>
<body>
<div class="login-card">
    <div class="login-icon">⭐</div>
    <h1>积分系统</h1>
    <p class="subtitle">完成任务，赚取平板时间</p>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <div class="divider"><span>孩子入口</span></div>
    
    <form action="/login" method="POST" style="margin-bottom:20px">
        <input type="hidden" name="username" value="lisa">
        <button type="submit" class="btn btn-child">
            <span><span class="child-icon">👧</span> 周楷依</span>
            <span class="child-arrow">→</span>
        </button>
    </form>
    
    <form action="/login" method="POST" style="margin-bottom:30px">
        <input type="hidden" name="username" value="huawei">
        <button type="submit" class="btn btn-child">
            <span><span class="child-icon">👶</span> 周芓翕</span>
            <span class="child-arrow">→</span>
        </button>
    </form>
    
    <div class="divider"><span>管理员</span></div>
    
    <form action="/login" method="POST">
        <div class="form-group">
            <input type="text" name="username" placeholder="管理员账号" value="admin" readonly style="background:#f5f5f7">
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="请输入密码" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary">登录</button>
    </form>
</div>
</body>
</html>
